     {t:"wr",q:"Idatzi forma"+(kind==="iu"?" ("+(useU?"UKAN":"IZAN")+")":""),s:'<div class="big2">'+lab+'</div>',a:al,show:show,ok:exOk(lab+" → "+show),bad:exBad(useU?"UKAN edo EDUKI (lehenaldia)":"IZAN lehenaldia")}]}
  r.push({t:"mt",p:pairs()});r.push({t:"mt",p:pairs()});
  for(i=0;i<3;i++)r.push(item()[0]);for(i=0;i<3;i++)r.push(item()[1]);
  return shuf(r)}
function mapS(S,fn){return S.map(fn)}


var G={key:"ukanLeh1",levels:[
 {n:"Taula singularra",gen:function(){return tabla("u")}},
 {n:"Taula plurala",gen:function(){return tabla("up")}},
 {n:"Singularra ala plurala?",gen:function(){return pick(UKP_,4).concat(pick(UKT_,4)).map(function(e){return mcS(e,"sp","Singularra ala plurala?")})}},
 {n:"UKAN edo EDUKI",gen:function(){return pick(UKP_,8).map(function(e){return mcS(e,"ch4","Aukeratu UKAN forma (idatziz EDUKI ere ontzat)")})}},
 {n:"UKAN laguntzailea",gen:function(){return pick(UKT_,8).map(function(e){return mcS(e,"ch4")})}},
 {n:"Orain ala lehen?",gen:function(){return tn(TNU)}},
 {n:"Idatzi esaldietan",gen:function(){return pick(UKP_.concat(UKT_),8).map(wrS)}},
 {n:"Bi hutsune",gen:function(){return pick(UK2,8).map(w2S)}},
 {n:"Erronka",gen:function(){return shuf(pick(UKP_.concat(UKT_),4).map(wrS).concat(pick(UK2,4).map(w2S)))}}]};

var $=function(i){return document.getElementById(i)};
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function ri(k){return Math.floor(Math.random()*k)}
function nz(s){return s.toLowerCase().replace(/[\s.,!?¡¿\-'’]/g,"")}
function pick(a,n){return shuf(a.slice()).slice(0,n)}
function o4(c,pool,n){var o=[c];shuf(pool.slice()).forEach(function(x){if(o.length<(n||4)&&o.indexOf(x)<0)o.push(x)});return shuf(o)}
function exOk(b,es){return '<div class="b">'+b+'</div>'+(es?'<div class="es">'+es+'</div>':'')}
function exBad(t){return "<b>Zergatia:</b><br>"+t}
var TOTAL=8,PASS=6,save={open:1,stars:{}},lv=0,qi=0,hits=0,checked=false,chk=null,items=[];
try{var sv=JSON.parse(localStorage.getItem(G.key));if(sv&&sv.open)save=sv}catch(e){}
function persist(){try{localStorage.setItem(G.key,JSON.stringify(save))}catch(e){}}
function drawPath(){
  var p=$("path");p.innerHTML="";
  G.levels.forEach(function(L,i){
    var b=document.createElement("button");
    b.className="dot"+(i===lv?" on":"")+(save.stars[i]?" done":"");
    b.textContent=i+1;b.title=L.n;b.setAttribute("aria-label",(i+1)+". maila: "+L.n);
    b.disabled=i+1>save.open;b.onclick=function(){start(i)};p.appendChild(b);
  });
}
function start(i){
  lv=i;qi=0;hits=0;$("play").hidden=false;$("end").hidden=true;
  items=G.levels[i].gen();while(items.length<TOTAL)items.push(items[items.length%Math.max(items.length,1)]);
  $("lname").textContent=(i+1)+". maila: "+G.levels[i].n;drawPath();ask();
}
function setFb(t,c){var f=$("fb");f.textContent=t;f.className="fb"+(c?" "+c:"")}
function ask(){
  checked=false;chk=null;setFb("","");$("ex").hidden=true;$("ex").innerHTML="";
  $("count").textContent=(qi+1)+" / "+TOTAL;$("bar").style.width=(qi/TOTAL*100)+"%";
  var it=items[qi],g=$("go");g.textContent="Egiaztatu";
  ({mc:mc,wr:wr,mt:mt,w2:w2})[it.t](it);
  g.hidden=!(it.t==="wr"||it.t==="w2");
}
function done(ok,msg,html){
  if(checked)return;checked=true;if(ok)hits++;
  setFb(msg,ok?"ok":"bad");
  if(html){var e=$("ex");e.innerHTML=html;e.hidden=false}
  var g=$("go");g.hidden=false;g.textContent=qi+1>=TOTAL?"Emaitza ikusi":"Hurrengoa";
  $("bar").style.width=((qi+1)/TOTAL*100)+"%";
}
function go(){if(checked){qi++;qi>=TOTAL?finish():ask()}else if(chk)chk()}
function mc(it){
  $("stage").innerHTML='<p class="task">'+it.q+'</p>'+(it.s||"")+'<div class="opts" id="opts"></div>';
  var o=$("opts");
  it.o.forEach(function(t){
    var b=document.createElement("button");b.className="chip";b.textContent=t;
    b.onclick=function(){
      if(checked)return;var ok=t===it.a;b.className="chip "+(ok?"good":"wrong");
      if(!ok)Array.prototype.forEach.call(o.children,function(k,i){if(it.o[i]===it.a)k.className="chip good"});
      done(ok,ok?"Oso ondo!":"Zuzena: "+it.a,ok?it.ok:it.bad);
    };o.appendChild(b);
  });
}
function wr(it){
  $("stage").innerHTML='<p class="task">'+it.q+'</p>'+(it.s||"")+'<input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Erantzuna">';
  var inp=$("inp");setTimeout(function(){inp.focus()},50);
  chk=function(){
    var v=nz(inp.value);if(!v)return setFb("Idatzi zure erantzuna.","");
    var ok=it.a.indexOf(v)>-1;inp.className=ok?"ok":"bad";inp.readOnly=true;
    done(ok,ok?"Oso ondo!":"Zuzena: "+it.show,ok?it.ok:it.bad);
  };
}
function mt(it){
  var n=it.p.length,right=shuf(it.p.map(function(_,i){return i}));
  $("stage").innerHTML='<p class="task">'+(it.q||"Lotu bakoitza bere bikotearekin")+'</p><div class="cols"><div id="cl"></div><div id="cr"></div></div>';
  var sl=null,sr=null,rest=n,bad=0,flash=false,bl={},br={};
  function mk(i,side,txt){
    var b=document.createElement("button");b.className="chip";b.textContent=txt;
    b.onclick=function(){
      if(b.disabled||flash||checked)return;
      if(side==="l"){if(sl!==null)bl[sl].classList.remove("sel");sl=i}else{if(sr!==null)br[sr].classList.remove("sel");sr=i}
      b.classList.add("sel");
      if(sl!==null&&sr!==null){
        var x=bl[sl],y=br[sr];
        if(sl===sr){x.className=y.className="chip good";x.disabled=y.disabled=true;rest--;
          if(!rest){var h=it.p.map(function(q){return q[0]+" = "+q[1]}).join("<br>");
            done(bad<=1,bad?(bad<=1?"Ia-ia! Akats bat.":"Akats gehiegi."):"Oso ondo!",'<div class="es">'+h+'</div>')}
        }else{bad++;flash=true;x.classList.add("wrong");y.classList.add("wrong");
          setTimeout(function(){x.className=y.className="chip";flash=false},550)}
        sl=sr=null;
      }
    };(side==="l"?bl:br)[i]=b;$(side==="l"?"cl":"cr").appendChild(b);
  }
  it.p.forEach(function(q,i){mk(i,"l",q[0])});right.forEach(function(i){mk(i,"r",it.p[i][1])});
}
function w2(it){
  var inp=function(id){return '<input class="inp2" id="'+id+'" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Erantzuna">'};
  $("stage").innerHTML='<p class="task">'+it.q+'</p>'+it.s+'<div class="lab">1</div>'+inp("i1")+'<div class="lab">2</div>'+inp("i2");
  setTimeout(function(){$("i1").focus()},50);
  chk=function(){
    var v=[nz($("i1").value),nz($("i2").value)];if(!v[0]||!v[1])return setFb("Idatzi bi erantzunak.","");
    var ok=true,lines=[];
    [0,1].forEach(function(i){var r=it.a[i].indexOf(v[i])>-1;if(!r){ok=false;lines.push(it.r[i])}
      var el=$("i"+(i+1));el.className="inp2 "+(r?"ok":"bad");el.readOnly=true});
    done(ok,ok?"Oso ondo!":"Zuzena: "+it.show,ok?it.ok:exBad(lines.join("<br>")));
  };
}
function finish(){
  var won=hits>=PASS,st=hits>=TOTAL?3:hits>=7?2:won?1:0,last=lv===G.levels.length-1;
  $("play").hidden=true;$("end").hidden=false;
  $("stars").textContent="★".repeat(st)+"☆".repeat(3-st);
  $("etitle").textContent=won?"Maila gaindituta!":"Ia-ia lortu duzu";
  $("etext").textContent=TOTAL+"tik "+hits+" asmatu dituzu."+(won?"":" Gainditzeko "+PASS+" behar dituzu. Saiatu berriro!");
  if(won){save.stars[lv]=Math.max(save.stars[lv]||0,st);if(!last&&save.open<lv+2)save.open=lv+2;persist();
    if(last)$("etext").textContent+=" Ibilbide osoa osatu duzu!"}
  var nx=$("next");nx.hidden=!(won&&!last);nx.textContent="Joan "+(lv+2)+". mailara";nx.onclick=function(){start(lv+1)};
  drawPath();
}
$("go").onclick=go;$("again").onclick=function(){start(lv)};
document.addEventListener("keydown",function(e){
  if($("play").hidden||e.key!=="Enter")return;
  if(e.target.tagName==="INPUT"||e.target===document.body){e.preventDefault();go()}
});
start(Math.min(save.open,G.levels.length)-1);

</script>
