<!doctype html>
<html lang="eu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lehenaldia</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1b8;--card:#fffdf3;--ink:#14213d;--mut:#6a5a1e;--acc:#2457d6;--accink:#ffffff;--mint:#0f8f82;--line:#e8cf7a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#2a2208;--card:#3a2f0f;--ink:#fff4cf;--mut:#d6c78d;--acc:#8fb0ff;--accink:#0e1d4a;--mint:#3fd6c5;--line:#5f5120}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;min-height:100%}
main{max-width:480px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:2rem;font-weight:800;margin:0 0 4px;text-align:center}
.sub{text-align:center;color:var(--mut);font-size:1.2rem;margin:0 0 24px}
.game{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:24px;padding:22px 18px;margin-bottom:16px;text-align:center;transition:transform .12s,border-color .12s}
.game:hover,.game:focus-visible{border-color:var(--acc);transform:translateY(-3px);outline:none}
.game:focus-visible{outline:4px solid var(--mint);outline-offset:3px}
.ico{font-size:3rem;line-height:1;margin-bottom:6px}
.game h2{margin:0;font-size:1.7rem;font-weight:800}
.game p{margin:4px 0 14px;color:var(--mut);font-size:1.1rem}
.btn{display:inline-block;background:var(--acc);color:var(--accink);font-weight:800;font-size:1.2rem;padding:8px 26px;border-radius:14px}
</style>
</head>
<body>
<main>

  <a class="back" href="index.html" style="color:var(--mut);text-decoration:none;font-weight:700">← Hasiera</a>
  <h1>Lehenaldia</h1>
  <p class="sub">Aukeratu jolas bat</p>

  <a class="game" href="izan-lehenaldia.html">
    <div class="ico">🅸</div>
    <h2>IZAN lehenaldia</h2>
    <p>Nintzen, zinen, zen...</p>
    <span class="btn">Jolastu</span>
  </a>

  <a class="game" href="ukan-lehenaldia.html">
    <div class="ico">🅤</div>
    <h2>UKAN lehenaldia</h2>
    <p>Nuen, zenuen... eta eduki: neukan</p>
    <span class="btn">Jolastu</span>
  </a>

  <a class="game" href="izan-ukan-lehenaldia.html">
    <div class="ico">🔀</div>
    <h2>IZAN eta UKAN lehenaldia</h2>
    <p>Noiz bat, noiz bestea</p>
    <span class="btn">Jolastu</span>
  </a>

</main>
</body>
</html>
